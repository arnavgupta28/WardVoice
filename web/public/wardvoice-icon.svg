<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">WardVoice app icon: a medical cross carrying a voice waveform</title>
  <defs>
    <linearGradient id="wv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82FF"/>
      <stop offset="1" stop-color="#0B4FD6"/>
    </linearGradient>
    <linearGradient id="wv-cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EAF7"/>
    </linearGradient>
  </defs>
  <!-- squircle tile -->
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#wv-bg)"/>
  <ellipse cx="46" cy="26" rx="34" ry="12" fill="#FFFFFF" opacity="0.14"/>
  <!-- medical cross -->
  <path d="M50 22 h28 a6 6 0 0 1 6 6 v16 h16 a6 6 0 0 1 6 6 v28 a6 6 0 0 1 -6 6 h-16 v16 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 v-16 h-16 a6 6 0 0 1 -6 -6 v-28 a6 6 0 0 1 6 -6 h16 v-16 a6 6 0 0 1 6 -6 z" fill="url(#wv-cross)"/>
  <!-- voice waveform inside the cross -->
  <g stroke="#0B5FFF" stroke-width="6" stroke-linecap="round">
    <line x1="44" y1="58" x2="44" y2="70"/>
    <line x1="54" y1="50" x2="54" y2="78"/>
    <line x1="64" y1="42" x2="64" y2="86"/>
    <line x1="74" y1="50" x2="74" y2="78"/>
    <line x1="84" y1="58" x2="84" y2="70"/>
  </g>
  <!-- care pulse dot -->
  <circle cx="104" cy="24" r="9" fill="#E5243B" stroke="#FFFFFF" stroke-width="3"/>
</svg>
